[project]
name = "qed-dtc"
version = "1.0.0"
description = "Finite-size discrete time crystals in the open Dicke model (arXiv:2610.27589)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Haimi Nguyen"},
]
keywords = ["discrete time crystal", "Dicke model", "cavity QED", "truncated Wigner"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "qutip>=4.7",
  "numba>=0.58",
  "pandas>=2.0",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
